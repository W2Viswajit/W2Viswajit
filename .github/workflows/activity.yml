name: Update activity graph

on:
  schedule:
    - cron: '37 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/activity.py
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity-graph
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate contribution graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/activity.py
      - name: Commit refreshed graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh activity graph"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
